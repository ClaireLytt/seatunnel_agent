# Browser-driven UI smoke regression (zero LLM tokens, ~4 min).
# Runs the 25-case smoke suite in a real headless Chromium against the app
# booted on a dedicated port. Fails the PR on any FAIL/ERROR; the full HTML
# report (with failure screenshots) is uploaded as an artifact.
name: ui-smoke

on:
  pull_request:
    paths:
      - "src/seatunnel_agent/**"
      - "tests/**"
      - "frontend/uitest/**"
      - "pyproject.toml"
      - ".github/workflows/uitest.yml"
  workflow_dispatch:

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      # load_settings() is only called from LLM handlers, which --no-llm
      # never reaches — the dummy key just guards accidental lookups.
      API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,uitest,sqlreview]"
          python -m playwright install --with-deps chromium

      # Build the React /uitest page so the app under test serves it (and the
      # browser smoke tests target the real frontend, not a fallback).
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/uitest/package-lock.json
      - name: Build /uitest frontend
        run: npm ci && npm run build
        working-directory: frontend/uitest

      - name: Run UI smoke suite (no LLM)
        run: python -m seatunnel_agent.agents.devops.ui_testing run --suite smoke --no-llm

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-report
          path: runs/
          retention-days: 14
          if-no-files-found: ignore

      # Post (or update) a PR comment listing the failed cases plus a link to
      # the run's artifacts. Skipped on fork PRs (no write token) and tolerant
      # of comment failures so it never masks the real test failure.
      - name: Comment failures on PR
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- uitest-report -->';

            // Latest runs/<timestamp>/result.json from this run.
            let failed = [];
            try {
              const dirs = fs.readdirSync('runs')
                .filter(d => fs.existsSync(path.join('runs', d, 'result.json')))
                .sort();
              if (dirs.length) {
                const rr = JSON.parse(fs.readFileSync(
                  path.join('runs', dirs[dirs.length - 1], 'result.json'), 'utf8'));
                failed = (rr.cases || [])
                  .filter(c => c.verdict !== 'PASS')
                  .map(c => `- \`${c.case_id}\` ${c.title} (${c.verdict})`);
              }
            } catch (e) {
              core.warning(`could not parse result.json: ${e}`);
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## UI smoke failed',
              '',
              failed.length ? '**Failed cases:**' : '_Could not read case results — see the run log._',
              ...failed,
              '',
              `Screenshots & HTML report: [run artifacts](${runUrl}) (artifact \`ui-smoke-report\`)`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
