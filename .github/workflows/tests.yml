# Unit/integration tests on every PR (no browser, no LLM, no DB) with a
# coverage floor. The UI browser suite is uitest.yml; this one is the
# 1700+ pytest cases that previously only ran on developer machines.
name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,uitest,sqlreview,test]"

      - name: Run pytest with coverage
        run: >
          python -m pytest tests/ -q
          --cov=seatunnel_agent --cov-report=term-missing:skip-covered
          --cov-fail-under=60

      # The unit suite runs without the mcp package by design; this step
      # guards the SDK-compat shim (mcp 2.x renamed FastMCP -> MCPServer)
      # by booting the real server on the current SDK and listing tools.
      - name: MCP server boot smoke (current mcp SDK)
        run: |
          pip install "mcp>=1.2"
          python -c "
          import anyio
          from seatunnel_agent.mcp_toolbox import create_mcp_server
          tools = anyio.run(create_mcp_server().list_tools)
          assert len(tools) >= 15, [t.name for t in tools]
          print('mcp boot ok:', len(tools), 'tools')
          "
