# Nightly full UI regression: every automated case, two rounds to surface
# flaky verdicts (rounds with differing verdicts are reported as FLAKY).
# Zero LLM tokens (--no-llm); ai_judge cases are SKIP by design here and
# covered by developers running with an API key.
name: ui-nightly

on:
  schedule:
    - cron: "23 18 * * *"   # 02:23 Asia/Shanghai, off the :00 rush
  workflow_dispatch:

jobs:
  ui-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,uitest,sqlreview]"
          python -m playwright install --with-deps chromium

      # history.jsonl accumulates one line per run; caching it across
      # nights is what turns single runs into a flaky trend
      - name: Restore verdict history
        uses: actions/cache@v4
        with:
          path: runs/history.jsonl
          key: uitest-history-${{ github.run_id }}
          restore-keys: uitest-history-

      - name: Run full UI suite twice (flaky detection)
        run: python -m seatunnel_agent.ui_testing run --suite full --no-llm --repeat 2

      # Tiny REAL-LLM smoke (only when the repo has an LLM secret): one ai:
      # step case + one ai_judge case. Guards the prompt / tool-schema /
      # multimodal-judge path that --no-llm never exercises. Hard-capped by
      # design (8 rounds / 30k tokens per ai step), so cost is cents.
      - name: LLM path smoke (B3a ai step + C3 ai_judge)
        if: ${{ secrets.UITEST_LLM_API_KEY != '' }}
        env:
          API_KEY: ${{ secrets.UITEST_LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.UITEST_LLM_PROVIDER || 'anthropic' }}
          MODEL_NAME: ${{ vars.UITEST_LLM_MODEL || 'claude-haiku-4-5-20251001' }}
          LLM_BASE_URL: ${{ vars.UITEST_LLM_BASE_URL || '' }}
        run: python -m seatunnel_agent.ui_testing run --case B3a C3

      - name: Cross-night flaky trend
        if: always()
        run: python -m seatunnel_agent.ui_testing trend --last 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-nightly-reports
          path: runs/
          retention-days: 30
          if-no-files-found: ignore
