# Nightly full UI regression: every automated case, two rounds to surface
# flaky verdicts (rounds with differing verdicts are reported as FLAKY).
# Zero LLM tokens (--no-llm); ai_judge cases are SKIP by design here and
# covered by developers running with an API key.
name: ui-nightly

on:
  schedule:
    - cron: "23 18 * * *"   # 02:23 Asia/Shanghai, off the :00 rush
  workflow_dispatch:

jobs:
  ui-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_KEY: ci-dummy
      # secrets are NOT allowed in step `if:` expressions (parse-time
      # rejection that invalidates the whole file) — mirror the secret
      # into env here and let the LLM-smoke step check env instead.
      UITEST_LLM_API_KEY: ${{ secrets.UITEST_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,uitest,sqlreview]"
          python -m playwright install --with-deps chromium

      # history.jsonl accumulates one line per run; caching it across
      # nights is what turns single runs into a flaky trend
      - name: Restore verdict history
        uses: actions/cache@v4
        with:
          path: runs/history.jsonl
          key: uitest-history-${{ github.run_id }}
          restore-keys: uitest-history-

      - name: Run full UI suite twice (flaky detection)
        run: python -m seatunnel_agent.ui_testing run --suite full --no-llm --repeat 2

      # Tiny REAL-LLM smoke (only when the repo has an LLM secret): one ai:
      # step case, one ai_judge case, one adversarial NEG case (the judge
      # must reject a deliberately false expectation — guards against
      # rubber-stamping). Hard-capped by design, so cost is cents.
      - name: LLM path smoke (B3a ai step + C3 ai_judge + NEG1 adversarial)
        if: ${{ env.UITEST_LLM_API_KEY != '' }}
        env:
          API_KEY: ${{ env.UITEST_LLM_API_KEY }}
          LLM_PROVIDER: ${{ vars.UITEST_LLM_PROVIDER || 'anthropic' }}
          MODEL_NAME: ${{ vars.UITEST_LLM_MODEL || 'claude-haiku-4-5-20251001' }}
          LLM_BASE_URL: ${{ vars.UITEST_LLM_BASE_URL || '' }}
        run: python -m seatunnel_agent.ui_testing run --case B3a C3 NEG1

      - name: Cross-night flaky trend
        if: always()
        run: python -m seatunnel_agent.ui_testing trend --last 30

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-nightly-reports
          path: runs/
          retention-days: 30
          if-no-files-found: ignore

  # Real-Hive end-to-end (HV1/HV2 + A1): the only automation that exercises
  # DESCRIBE FORMATTED parsing, dialect SQL (CONV/MD5/CHR chunk hashing) and
  # the full compare pipeline against an actual HiveServer2 — the class of
  # bug that sqlite-backed cases can never see (OwnerType: metadata leak,
  # control characters rejected by the XML-serialized MR job conf).
  ui-hive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_KEY: ci-dummy
      HIVE_HOST: 127.0.0.1
      HIVE_PORT: "10000"
      HIVE_DATABASE: default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,uitest,sqlreview,hive]"
          python -m playwright install --with-deps chromium

      - name: Start HiveServer2 (docker)
        run: docker run -d --name hs2 -p 10000:10000 -e SERVICE_NAME=hiveserver2 apache/hive:4.0.0

      - name: Wait for HiveServer2
        run: |
          python - <<'PY'
          import time
          from pyhive import hive
          for i in range(60):
              try:
                  hive.Connection(host="127.0.0.1", port=10000).close()
                  print("HiveServer2 is up")
                  break
              except Exception as exc:
                  print(f"waiting ({i}): {exc}")
                  time.sleep(5)
          else:
              raise SystemExit("HiveServer2 did not come up in 300s")
          PY

      - name: Seed dc_test_* tables
        run: python scripts/seed_hive.py --host 127.0.0.1 --port 10000 --database default

      - name: Run hive suite
        run: python -m seatunnel_agent.ui_testing run --suite hive --no-llm

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-hive-reports
          path: runs/
          retention-days: 14
          if-no-files-found: ignore
