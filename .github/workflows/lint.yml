# Fast correctness lint (ruff E9/F/B per pyproject [tool.ruff]) — the bug
# classes a manual audit caught once (unused imports, loop-capture,
# undefined names) stay caught automatically.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/seatunnel_agent tests

  # Gradual typing gate over the newest packages ([tool.mypy].files in
  # pyproject); grow the list as modules get annotated.
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy fastapi pydantic click
      - run: python -m mypy

  # Known-vulnerability audit over the project's resolved dependency tree
  # (pyproject main deps + transitives, via the PyPI advisory DB).
  # Hard gate: python-dotenv>=1.2.2 fixed PYSEC-2026-2270 and a clean-env
  # audit (2026-10-15) shows no remaining project/transitive advisories.
  # pip itself is upgraded first so the environment tooling (not a project
  # dependency) cannot trip the gate.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install . pip-audit
      - run: pip-audit
