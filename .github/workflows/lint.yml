# Fast correctness lint (ruff E9/F/B per pyproject [tool.ruff]) — the bug
# classes a manual audit caught once (unused imports, loop-capture,
# undefined names) stay caught automatically.
name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Mechanical batch-workflow checks (CLAUDE.md §7): no AI attribution
  # trailers in PR commits, and src/tests changes must ship an on-disk
  # report under docs/reports/. PR-only: push/dispatch have no base ref.
  workflow-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/check_workflow.py --range "origin/${{ github.base_ref }}...HEAD"

  # React frontend: uitest build must succeed, ESLint must be clean across
  # ALL workspaces, and Prettier clean on uitest+shared (single job, no matrix).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build --workspace uitest-frontend
      - run: npm run lint --workspaces --if-present
      - run: npx prettier --check uitest/src shared/src

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/seatunnel_agent tests scripts

  # Dogfood: our own leaked-credential scanner over the source tree
  # (.secretscan.yaml at the repo root exempts doc example keys).
  secretscan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . && pip install pyyaml
      - run: python -m seatunnel_agent.cli secretscan src scripts --fail-on high

  # Gradual typing gate over the newest packages ([tool.mypy].files in
  # pyproject); grow the list as modules get annotated.
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy fastapi pydantic click
      - run: python -m mypy

  # Known-vulnerability audit over the project's resolved dependency tree
  # (pyproject main deps + transitives, via the PyPI advisory DB).
  # Hard gate: python-dotenv>=1.2.2 fixed PYSEC-2026-2270 and a clean-env
  # audit (2026-10-15) shows no remaining project/transitive advisories.
  # pip and setuptools are upgraded first so the environment tooling (not a
  # project dependency) cannot trip the gate (pip 26.0.1 and setuptools 79.0.1
  # both carried advisories on the stock runner).
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install . pip-audit
      - run: pip-audit
