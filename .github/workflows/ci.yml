name: CI

on:
  push:
    branches: [main, chat]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,sqlreview]" pyyaml ruff
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q --ignore=tests/test_ui_smoke.py
      - name: Metric semantic-layer gate
        run: python -m seatunnel_agent.cli metrics validate --ddl config/schema_ddl.sql
      - name: Retrieval regression gate
        run: >
          python -m seatunnel_agent.cli t2s-bench
          --ddl tests/fixtures/t2s_bench_schema.sql
          --bench tests/fixtures/t2s_retrieval_bench.jsonl
          --gate
