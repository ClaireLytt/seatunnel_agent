# F/G/H/I/J/K/L/M/N 组 · 画像、校验和、分区、倾斜、自定义聚合、质量、增量、脱敏、采样

- id: F1
  title: 字段画像呈现空值率差异
  tags: [smoke, sqlite]
  setup:
    - use: select_orders
  steps:
    - click: 字段画像
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: email}
