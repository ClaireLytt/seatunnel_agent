    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: "0 未通过"}

- id: L1
  title: 水位线增量只对比新行
  tags: [full, sqlite]
  setup:
    - use: select_orders
    - open_accordion: 增量对比
    - fill: {水位线列: update_time}
    - fill: {上次值: "2024-06-05 00:00:00"}
  steps:
    - click: 增量对比
    - wait_result: {}
  expect:
    - text_not_contains: {in: 结果区, text: Traceback}
    - ai_judge: >-
        增量对比只包含水位线 2024-06-05 00:00:00 之后的行:
        A 侧 2 行(id=9,10),B 侧 3 行(id=3,5,11)。

- id: M1
  title: 敏感列打码 (phone/email/id_card)
  tags: [full, sqlite]
  setup:
    - use: select_orders
    - check: {target: 启用脱敏, on: true}
  steps:
    - click: 样本数据
    - wait_result: {}
  expect:
    - text_not_contains: {in: 结果区, text: "13800000011"}
    - ai_judge: >-
        样本数据中 phone / email / id_card 等敏感列的值以掩码形式
        展示(如 138****0001),没有出现完整明文手机号或身份证号。

- id: M2
  title: 取消脱敏恢复明文
