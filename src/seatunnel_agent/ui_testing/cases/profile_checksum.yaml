- id: K1
  title: 质量规则未通过 (email 非空率 / amount 范围)
  tags: [full, sqlite]
  setup:
    - use: select_orders
    - open_accordion: 质量规则
    - fill: {规则: "email:not_null>80, amount:range:0-1000"}
  steps:
    - click: 质量检查
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: "77.78"}
    - ai_judge: >-
        质量检查结果中,B 侧 email 非空率约 77.8% 未通过 80% 阈值,
        且 B 侧 amount 存在超出 0-1000 范围的值(id=11 为 1500)。

