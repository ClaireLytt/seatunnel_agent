- id: X4
  title: SQLite 分支隐藏字段回归 (浏览器提交 None)
  tags: [smoke, sqlite]
  steps:
    - select_ds: {value: SQLite, side: A}
    - fill: {数据库: config/uitest_demo.db, side: A}
    - click: {target: 连接, side: A}
    - wait_status_ok: {side: A}
  expect:
    - hidden: {target: 主机, side: A}
    - hidden: {target: 端口, side: A}
    - status_ok: {side: A}
    - text_contains: {in: 状态, side: A, text: "10"}
