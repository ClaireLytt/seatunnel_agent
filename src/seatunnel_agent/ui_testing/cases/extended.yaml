# ── Text2SQL 扩展 ──

- id: T2S4
  title: 切中文后再切回英文界面复原
  tags: [full, sqlite]
  page: /text2sql
  lang: en
  steps:
    - set_language: 中文
    - wait: 800
      note: i18n 重渲染
    - set_language: English
    - wait: 800
      note: i18n 重渲染
  expect:
    - text_contains: {in: 状态, text: Not connected}
    - visible: {target: 连接}

- id: SCH2
  title: Schema 浏览器选表后渲染字段卡片
  tags: [full, sqlite]
  page: /schema-browser
  lang: en
  setup:
    - goto: /text2sql
    - select_ds: {value: SQLite}
    - fill: {数据库: config/uitest_demo.db}
    - click: 连接
    - wait_status_ok: {side: A}
    - goto: /schema-browser
    - wait: 1200
      note: 页面挂载
    - click: Refresh
    - wait: 1500
      note: 下拉 choices 刷新无信号
  steps:
    - select_index: {of: "combobox[1]", index: 2}
      note: 表下拉无标签(label=\"\"),按页面第 2 个 combobox 定位;index 2 = dc_test_orders_a
    - wait_text: {text: order_no, timeout_ms: 10000}
  expect:
    - text_contains: {in: 页面, text: order_no}
    - text_contains: {in: 页面, text: amount}
