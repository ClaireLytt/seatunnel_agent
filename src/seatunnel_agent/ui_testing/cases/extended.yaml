# 扩展用例 · 覆盖薄弱点:方言切换 / DDL schema 校验 / 方向过滤 / 阈值边界 /
# 空列容错 / 下载控件出现。均为确定性用例,零 token。

# ── SQL Review 扩展 ──

- id: SR11
  title: 方言切换生效 (MySQL 报 WHERE 列函数,Hive 不报)
  tags: [full, sqlite]
  page: /sqlreview
  steps:
    - fill: {SQL: "SELECT id FROM t WHERE lower(name) = 'x'"}
    - select: {of: SQL 方言, value: MySQL}
    - click: 开始审查
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: LOWER}
      note: OLTP 方言下 WHERE 列函数使索引失效,应报

- id: SR12
  title: DDL schema 校验抓出不存在的列
  tags: [full, sqlite]
  page: /sqlreview
  setup:
    - open_accordion: 表结构 DDL
    - fill: {DDL 输入: "CREATE TABLE t1 (id BIGINT, name STRING);"}
  steps:
    - fill: {SQL: "SELECT t1.nope FROM t1"}
    - click: 开始审查
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: nope}
    - text_contains: {in: 结果区, text: 不存在}

- id: SR13
  title: 审查后下载报告按钮出现
  tags: [full, sqlite]
  page: /sqlreview
  steps:
    - fill: {SQL: "SELECT * FROM t"}
    - click: 开始审查
    - wait_result: {}
  expect:
    - visible: {target: 下载报告}

# ── 血缘扩展 ──

- id: LIN13
  title: 方向过滤为仅上游时不出现下游表
  tags: [full, sqlite]
  page: /lineage
  setup:
    - fill: {SQL 目录: examples/lineage_demo}
    - click: 构建血缘图
    - wait: 2500
      note: 构图结果写在侧栏
  steps:
    - select: {of: 目标表, value: dws.gmv_daily}
    - select: {of: 方向, value: 仅上游}
    - click: 查询血缘
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: dwd.orders_di}
    - text_not_contains: {in: 结果区, text: ads.top_users}
      note: 仅上游模式不应把下游 ads 表画进链路

