# DSK 组 · Data Skew 页 (/dataskew)。静态扫描是纯本地正则规则,无外部依赖;
# 实测探查用例连内置 SQLite 演示库 —— dc_test_metrics_a.region 预置 north 占
# 80%(阈值 20% 即判定倾斜,见 seed_sqlite.py / probe.py)。LLM 优化模式依赖
# 真实 API,不进本组(与 SR 组同一约定,真实 LLM 用例归 ai_cases.yaml)。
# DSK2-DSK6 逐条守护 detector 的核心规则:DS001/DS003/DS004/DS005/DS007/DS008。

- id: DSK1
  title: 空 SQL 点分析给出提示
  tags: [smoke, sqlite]
  page: /dataskew
  steps:
    - click: 开始分析
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: 请先粘贴 SQL}

- id: DSK2
  title: COUNT(DISTINCT) 被标记且报告带引擎参数 (DS001)
  tags: [smoke, sqlite]
  page: /dataskew
  steps:
    - fill: {SQL: "SELECT count(distinct user_id) FROM ods.user_log"}
    - click: 开始分析
    - wait_result: {}
  expect:
    - result_in_view: {}
    - text_contains: {in: 结果区, text: 数据倾斜分析报告}
    - text_contains: {in: 结果区, text: COUNT(DISTINCT) 单点聚合}
    - text_contains: {in: 结果区, text: 引擎参数建议}
    - visible: {target: 下载报告}

- id: DSK3
  title: JOIN 键未过滤 NULL 被标记 (DS007)
  tags: [smoke, sqlite]
  page: /dataskew
  steps:
    - fill: {SQL: "SELECT a.id FROM ods.a a LEFT JOIN ods.b b ON a.uid = b.uid"}
    - click: 开始分析
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: JOIN 键 NULL 值倾斜}
    - text_contains: {in: 结果区, text: NULL 过滤}

- id: DSK4
  title: JOIN 键套函数被标记 (DS008)
  tags: [full, sqlite]
  page: /dataskew
  steps:
    - fill: {SQL: "SELECT a.id FROM ods.a a JOIN ods.b b ON substr(a.uid,1,8) = b.uid"}
    - click: 开始分析
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: JOIN 键函数 / 类型转换}
    - text_contains: {in: 结果区, text: substr(a.uid,1,8)}

- id: DSK5
  title: 全局 ORDER BY 无 LIMIT 报高风险 (DS005)
  tags: [full, sqlite]
  page: /dataskew
  steps:
    - fill: {SQL: "SELECT * FROM ods.t ORDER BY amount"}
    - click: 开始分析
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: 高倾斜风险}
    - text_contains: {in: 结果区, text: 全局 ORDER BY}
    - text_contains: {in: 结果区, text: 单个 Task 排序}

- id: DSK6
  title: SELECT DISTINCT 与 UNION 去重同时标记 (DS003+DS004)
  tags: [full, sqlite]
  page: /dataskew
  steps:
    - fill: {SQL: "SELECT DISTINCT id FROM ods.a UNION SELECT id FROM ods.b"}
    - click: 开始分析
    - wait_result: {}
  expect:
    - text_contains: {in: 结果区, text: UNION 隐式去重}
    - text_contains: {in: 结果区, text: 全局 DISTINCT 去重}

- id: DSK7
