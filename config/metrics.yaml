# 指标语义层定义（Chat BI 口径白名单）
# schema_ddl.sql 是"表的白名单"，本文件是"口径的白名单"：
# 命中这里的指标时，SQL 由 build_metric_sql 确定性展开，不由 LLM 现场发挥。
# 校验：seatunnel-agent metrics validate --ddl config/schema_ddl.sql
#
# 星型 JOIN（维表维度）：additive 指标可声明 joins，把维表列作为下钻维度：
#   - name: gmv
#     table: dwd.dwd_trade_order_di      # 事实表（度量/过滤只能引用它的列）
#     expression: SUM(pay_amount)
#     time_column: dt
#     joins:
#       - table: dim.dim_channel         # 必须在表白名单中，且是非分区表
#         alias: ch                      # 唯一别名（保留别名 t 是事实表）
#         local_key: channel_id          # 事实表侧关联列
#         remote_key: channel_id         # 维表侧关联列（缺省同 local_key）
#         type: left                     # left | inner（缺省 left）
#         filters: ["is_deleted = 0"]    # 附加在 ON 上的维表过滤
#     dimensions: [channel_id, ch.channel_name]   # 维表维度写 别名.列名
version: 1
metrics:
  - name: sales_amount
    display_name: 销售额
    aliases: [销售金额, 营收, GMV]
    description: 销售订单明细表中订单金额的合计（不含退款冲销）
    table: cladata.sales_di
    expression: SUM(amount)
    time_column: pt
    dimensions: [city, category, product_name]
    unit: 元
    owner: 数据组

  - name: order_cnt
    display_name: 订单量
    aliases: [订单数, 单量]
    description: 销售订单明细表中订单编号的去重计数
    table: cladata.sales_di
    expression: COUNT(DISTINCT order_id)
    time_column: pt
    dimensions: [city, category, product_name]
    unit: 单
    owner: 数据组

  - name: avg_order_value
    display_name: 客单价
    aliases: [平均订单金额, AOV]
    description: 销售额 / 订单量
    type: ratio
    numerator: sales_amount
    denominator: order_cnt
    unit: 元
    owner: 数据组
