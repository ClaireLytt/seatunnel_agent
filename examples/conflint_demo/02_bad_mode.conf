# 配置深度检查演示 · 运行模式问题：CDC 源 + BATCH、非法 parallelism、角色用反
env {
  parallelism = 0
  job.mode = "BATCH"
}

source {
  MySQL-CDC {
    result_table_name = "cdc"
    hostname = "127.0.0.1"
    port = 3306
    database-name = "demo"
    table-name = "demo.users"
    username = "root"
    password = "secret-demo-only"
  }
  Console {
    # Console 是 sink-only 连接器，放进 source 段是角色错误
  }
}

sink {
  Doris {
    source_table_name = "cdc"
    fenodes = "127.0.0.1:8030"
    database = "demo"
    table = "users"
    user = "root"
    password = "secret-demo-only"
  }
}
