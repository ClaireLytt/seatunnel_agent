# 配置深度检查演示 · 参数问题：拼错的参数、缺失必填、未知连接器、类型不符
env {
  parallelism = 2
  job.mode = "BATCH"
}

source {
  Jdbc {
    result_table_name = "src"
    url = "jdbc:mysql://127.0.0.1:3306/demo"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    # password 缺失（必填）
    quary = "SELECT * FROM users"       # 拼错：应为 query
  }
}

sink {
  Consloe {                             # 拼错：应为 Console
    source_table_name = "src"
  }
}
