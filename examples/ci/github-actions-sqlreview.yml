# Copy to .github/workflows/sqlreview.yml in your repo.
# Reviews *.sql files changed in the PR and uploads results to
# GitHub Code Scanning (Security tab) as SARIF.
name: SQL Review

on:
  pull_request:
    paths:
      - "**/*.sql"

jobs:
  sqlreview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reviewer
        run: pip install git+https://github.com/ClaireLytt/seatunnel_agent.git

      - name: Review changed SQL
        run: |
          seatunnel-agent review \
            --diff --diff-base origin/${{ github.base_ref }} \
            --static-only --fail-on critical \
            --format sarif -o results.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
