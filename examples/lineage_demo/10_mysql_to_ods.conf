# 入仓：业务库 MySQL -> 数仓 ODS
env {
  parallelism = 2
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://mysql-prod:3306/shop"
    driver = "com.mysql.cj.jdbc.Driver"
    database = "shop"
    table_name = "orders"
    result_table_name = "src_orders"
  }
}

sink {
  Hive {
    database = "ods"
    table_name = "orders_raw"
    source_table_name = "src_orders"
  }
}
