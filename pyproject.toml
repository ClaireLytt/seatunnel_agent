[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seatunnel-agent"
version = "0.1.0"
description = "AI-powered SeaTunnel pipeline builder and debugger (supports Claude, DeepSeek, Kimi, and other LLMs)"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyhocon>=0.3.60",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0"]
all = ["anthropic>=0.40.0", "openai>=1.0"]
ui = ["gradio>=4.0"]
dev = [
    "pytest>=7.0",
    "pytest-mock",
    "anthropic>=0.40.0",
    "openai>=1.0",
]

[project.scripts]
seatunnel-agent = "seatunnel_agent.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
