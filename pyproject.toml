[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seatunnel-agent"
version = "0.2.0"
description = "AI-powered SeaTunnel pipeline builder and debugger (supports Claude, DeepSeek, Kimi, and other LLMs)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyhocon>=0.3.60",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0"]
ui = ["gradio>=4.0"]
chart = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
pdf = ["fpdf2>=2.7"]
hive = ["pyhive[hive]>=0.7"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
sqlserver = ["pymssql>=2.2"]
clickhouse = ["clickhouse-connect>=0.7"]
doris = ["pymysql>=1.1"]
db-all = [
    "pyhive[hive]>=0.7",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
    "pymssql>=2.2",
    "clickhouse-connect>=0.7",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.0",
    "gradio>=4.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]
dev = [
    "pytest>=7.0",
    "pytest-mock",
    "pytest-cov",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "gradio>=4.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[project.urls]
Homepage = "https://github.com/ClaireLytt/seatunnel_agent"
Repository = "https://github.com/ClaireLytt/seatunnel_agent"
"Bug Tracker" = "https://github.com/ClaireLytt/seatunnel_agent/issues"

[project.scripts]
seatunnel-agent = "seatunnel_agent.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = ["integration: real-database integration tests (no mocks)"]

[tool.setuptools.packages.find]
where = ["src"]
