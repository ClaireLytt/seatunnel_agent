[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seatunnel-agent"
version = "0.2.0"
description = "AI-powered SeaTunnel pipeline builder and debugger (supports Claude, DeepSeek, Kimi, and other LLMs)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyhocon>=0.3.60",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0"]
ui = ["gradio>=6.0"]
chart = ["matplotlib>=3.7"]
excel = ["openpyxl>=3.1"]
pdf = ["fpdf2>=2.7"]
hive = ["pyhive[hive_pure_sasl]>=0.7"]
uitest = ["playwright>=1.40", "pyyaml>=6.0"]
test =["pytest>=8.0", "pytest-mock>=3.12", "pytest-cov>=5.0", "httpx>=0.27"]
sqlreview = ["sqlglot>=20.0"]
mysql = ["pymysql>=1.1"]
mcp = ["mcp>=1.2"]
postgres = ["psycopg2-binary>=2.9"]
sqlserver = ["pymssql>=2.2"]
clickhouse = ["clickhouse-connect>=0.7"]
doris = ["pymysql>=1.1"]
db-all = [
    "pyhive[hive_pure_sasl]>=0.7",
    "pymysql>=1.1",
    "psycopg2-binary>=2.9",
    "pymssql>=2.2",
    "clickhouse-connect>=0.7",
]
all = [
    "anthropic>=0.40.0",
    "openai>=1.0",
    "gradio>=6.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "sqlglot>=20.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock",
    "pytest-cov",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "anthropic>=0.40.0",
    "openai>=1.0",
    "gradio>=6.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ClaireLytt/seatunnel_agent"
Repository = "https://github.com/ClaireLytt/seatunnel_agent"
"Bug Tracker" = "https://github.com/ClaireLytt/seatunnel_agent/issues"

[project.scripts]
seatunnel-agent = "seatunnel_agent.cli:cli"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E9/F: syntax + correctness; B: bugbear; I: import sorting; W: warnings
# (whitespace/style). Legacy style debt stays out of scope:
# B904/B905/B008/B023 are documented false positives or style-only.
# UP: pyupgrade, except UP017 (datetime.UTC needs 3.11 but requires-python
# is >=3.10) and UP042 (str-enum refactor, manual). Not enabled yet:
#   SIM (simplify, ~37 violations, only 5 auto-fixable — left for later).
select = ["E9", "F", "B", "I", "W", "UP", "A", "RET", "C4", "RUF100"]
ignore = ["B904", "B905", "B008", "B023", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
# tests may assert broad exception classes on degraded external systems
"tests/*" = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not uitest'"
markers = [
    "uitest: browser-driven UI regression (run explicitly: pytest -m uitest)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
# Gradual typing: only the newest, self-contained packages are checked;
# grow this list as modules get annotated. Keep settings lenient enough
# that the gate catches real type bugs without demanding full annotation.
python_version = "3.11"
files = [
    "src/seatunnel_agent/hub/registry.py",
    "src/seatunnel_agent/common/notify.py",
    "src/seatunnel_agent/common/config.py",
    "src/seatunnel_agent/common/context.py",
    "src/seatunnel_agent/common/jsonl_log.py",
    "src/seatunnel_agent/common/settings_store.py",
    "src/seatunnel_agent/common/session_scope.py",
    "src/seatunnel_agent/common/sql_text.py",
    "src/seatunnel_agent/common/utils.py",
    "src/seatunnel_agent/common/llm_usage.py",
    "src/seatunnel_agent/agents/devops/secret_scan",
    "src/seatunnel_agent/agents/devops/dep_check",
    "src/seatunnel_agent/agents/devops/release_notes",
    "src/seatunnel_agent/agents/devops/ci_inspect",
    "src/seatunnel_agent/agents/ai/doc_qa",
    "src/seatunnel_agent/agents/ai/llm_cost",
    "src/seatunnel_agent/agents/devops/bot",
    "src/seatunnel_agent/agent_core",
    "src/seatunnel_agent/agents/ai/code_fix",
    "src/seatunnel_agent/agents/ai/issue_triage",
    "src/seatunnel_agent/agents/devops/doctor",
    "src/seatunnel_agent/agents/ai/web_task",
    "src/seatunnel_agent/agents/data/metric_diff",
    "src/seatunnel_agent/agents/data/data_quality",
    "src/seatunnel_agent/agents/data/pii_scan",
    "src/seatunnel_agent/agents/data/dag_check",
    "src/seatunnel_agent/common/llm.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# gradual gate: imported legacy modules are analyzed for inference but their
# errors are NOT reported — only the files listed above gate the build
follow_imports = "silent"
