# pre-commit hook definitions for this repo.
# Usage in a consumer repo's .pre-commit-config.yaml:
#   repos:
#     - repo: https://github.com/ClaireLytt/seatunnel_agent
#       rev: main
#       hooks:
#         - id: sqlreview
- id: sqlreview
  name: SQL Code Review (static)
  description: Static SQL review for Hive/Spark/Flink/MaxCompute (no LLM needed)
  entry: seatunnel-agent review --static-only --fail-on critical
  language: python
  files: \.sql$
